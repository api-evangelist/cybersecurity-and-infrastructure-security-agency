- aid: cybersecurity-and-infrastructure-security-agency:advisories
  name: CISA Cybersecurity Advisories
  description: >-
    CISA publishes Cybersecurity Advisories (CSAs), Industrial Control Systems Advisories (ICSAs), and
    Common Security Advisory Framework (CSAF) JSON documents describing tactics, techniques, indicators,
    and required mitigations for active threats. Advisories are browsable on cisa.gov and many are exported
    as machine-readable CSAF JSON.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg

apis:
- aid: cybersecurity-and-infrastructure-security-agency:ais
  name: CISA Automated Indicator Sharing (AIS) TAXII Server
  description: >-
    CISA's Automated Indicator Sharing (AIS) program uses a TAXII 2.1 server to deliver STIX-formatted
    cyber threat indicators (CTI) and defensive measures (DM) to vetted partners. AIS includes AIS PUBLIC,
    FEDGOV, and CISCP feed communities. Connection requires a static IP, a Terms of Use, and an Interconnection
    Agreement; commercial data aggregators also redistribute AIS content to subscribers.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: >-
    https://www.cisa.gov/topics/cyber-threats-and-advisories/information-sharing/automated-indicator-sharing-ais
  tags:
